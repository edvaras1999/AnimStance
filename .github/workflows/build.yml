name: Build AnimStanceLE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Caprica only publishes a .7z (no .zip), and newer builds are not releases at all.
      # Pin v0.3.0 so a future release layout cannot break the build.
      - name: Download Caprica (Papyrus compiler) v0.3.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path tools/caprica | Out-Null
          gh release download v0.3.0 --repo Orvid/Caprica --pattern "*.7z" --dir tools/caprica --clobber
          Get-ChildItem tools/caprica
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = "C:\Program Files\7-Zip\7z.exe" }
          Get-ChildItem tools/caprica -Filter *.7z | ForEach-Object { & $sevenZip x $_.FullName "-otools/caprica" -y | Out-Null }
          $exe = Get-ChildItem tools/caprica -Recurse -Filter Caprica.exe | Select-Object -First 1
          if (-not $exe) { throw "Caprica.exe not found after extraction" }
          Write-Host "Found:" $exe.FullName

      - name: Caprica help (diagnostics)
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = (Get-ChildItem tools/caprica -Recurse -Filter Caprica.exe | Select-Object -First 1).FullName
          & $exe --help

      # Caprica has a built-in flags file for Starfield only, so for Skyrim the flags file is passed explicitly.
      # It also adds the current directory to the import list FIRST and derives the script namespace from
      # whichever import directory contains the file. Run from the repo root, ASL_MCM.psc got the namespace
      # "Source/Scripts" and Skyrim rejects that ("Invalid namespacing on Skyrim script"). So the compiler runs
      # from inside Source/Scripts: the script then sits at the root of the import directory, namespace "".
      - name: Compile ASL_MCM.psc
        shell: pwsh
        run: |
          $exe     = (Get-ChildItem tools/caprica -Recurse -Filter Caprica.exe | Select-Object -First 1).FullName
          $root    = (Get-Location).Path
          $stubs   = Join-Path $root "Stubs"
          $flags   = Join-Path $stubs "TESV_Papyrus_Flags.flg"
          $outDir  = Join-Path $root "build/Scripts"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $flagForms = @($flags, "TESV_Papyrus_Flags.flg", "../../Stubs/TESV_Papyrus_Flags.flg")
          $ok = $false
          Push-Location (Join-Path $root "Source/Scripts")
          try {
            Copy-Item $flags . -Force      # lets the bare file name form work as well
            foreach ($f in $flagForms) {
              Write-Host "=== Attempt: --flags $f"
              Remove-Item "$outDir/*.pex" -ErrorAction SilentlyContinue
              & $exe --game skyrim --flags $f --import $stubs --output $outDir ASL_MCM.psc
              if ($LASTEXITCODE -eq 0 -and (Test-Path "$outDir/ASL_MCM.pex")) { $ok = $true; Write-Host "OK with --flags $f"; break }
            }
          } finally {
            Remove-Item ./TESV_Papyrus_Flags.flg -ErrorAction SilentlyContinue
            Pop-Location
          }
          if (-not $ok) { throw "Caprica failed with every --flags form (see the output above)" }
          Get-ChildItem $outDir

      - name: Package the mod zip
        shell: pwsh
        run: python tools/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: AnimStanceLE
          path: dist/*.zip
          if-no-files-found: error
