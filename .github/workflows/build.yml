name: Build AnimStanceLE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The plugin is generated by tools/make_esp.py. Fail if the committed ESP drifts from the generator,
      # so the FormIDs the OAR/DAR conditions refer to can never change by accident.
      - name: Check Data/AnimStanceLE.esp matches the generator
        run: |
          python tools/make_esp.py "$RUNNER_TEMP/esp"
          cmp "$RUNNER_TEMP/esp/AnimStanceLE.esp" Data/AnimStanceLE.esp

      - name: Package the mod zip
        run: python tools/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: AnimStanceLE
          path: dist/*.zip
          if-no-files-found: error
